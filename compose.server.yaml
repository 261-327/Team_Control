# Server stack uses the existing PostgreSQL. Add compose.server-db.yaml for its Docker volume.
name: backend
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set the public host},backend,127.0.0.1
      FRONTEND_URL: ${FRONTEND_URL:?Set the public URL including https://}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set the public origin including https://}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY_HEADERS: "true"
      DB_HOST: ${DB_HOST:?Set the existing DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set the existing DB_NAME}
      DB_USER: ${DB_USER:?Set the existing DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set the existing DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${EMAIL_HOST:?Set the SMTP host}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:?Set the SMTP user}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?Set the SMTP password}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set the sender address}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      DJANGO_API_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${SIPI_BIND_ADDRESS:-127.0.0.1}:${SIPI_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/health/]
      interval: 10s
      timeout: 5s
      retries: 10
