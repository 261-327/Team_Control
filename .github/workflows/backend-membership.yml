name: Backend and frontend checks

on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'scripts/**', 'tests/**', '.github/workflows/backend-membership.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'scripts/**', 'tests/**', '.github/workflows/backend-membership.yml']

permissions:
  contents: read

jobs:
  django-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: team_control_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES: '1'
      DB_NAME: team_control_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      DJANGO_SETTINGS_MODULE: config.test_settings
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s ../tests -p test_local_dev.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test tasks --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regressions (isolated fixtures)
        run: npx playwright test e2e/backlog-regressions.spec.ts e2e/calendar-navigation.spec.ts e2e/domain.spec.ts e2e/custom-direction.spec.ts e2e/proxy-headers.spec.ts
        env:
          SIPI_START_TEST_SERVER: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results/
          retention-days: 7
