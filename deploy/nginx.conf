# This gateway is bound to loopback, behind the server's existing HTTPS proxy.
map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $django http://backend:8000;
    set $next http://frontend:3000;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $public_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 70s;

    location ~ ^/(api|admin|static|legacy)(/|$) {
        proxy_pass $django;
    }
    location / {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_pass $next;
    }
}
