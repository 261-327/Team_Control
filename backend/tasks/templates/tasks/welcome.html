<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Control — Добро пожаловать</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: #202139; background: #f4f5f7; }
main { width: 100%; max-width: 420px; padding: 40px 28px; border: 1px solid #e8e9f0; border-radius: 20px; background: white; box-shadow: 0 16px 48px rgba(32,33,57,.07); text-align: center; }
.logo { display: inline-grid; place-items: center; width: 52px; height: 52px; border-radius: 14px; background: #5145cd; color: white; font-size: 20px; font-weight: bold; }
h1 { margin: 24px 0 12px; font-size: 30px; }
p { margin: 0 0 32px; color: #6c6d80; line-height: 1.6; }
nav { display: grid; gap: 12px; }
a { display: block; padding: 14px 10px; border: 1px solid #5145cd; border-radius: 10px; color: white; background: #5145cd; font-size: 16px; font-weight: bold; text-decoration: none; }
a:hover { background: #4035a8; }
a.secondary { color: #5145cd; background: white; }
a.secondary:hover { background: #f2f0ff; }
a:focus-visible { outline: 3px solid #a69df0; outline-offset: 4px; }
</style>
</head>
<body>
<main>
<div class="logo" aria-hidden="true">TC</div>
<h1>Team Control</h1>
<p>Проекты, задачи и команда — в одном месте.</p>
<nav aria-label="Вход в Team Control">
<a href="{% url 'login_request' %}">Войти</a>
<a class="secondary" href="{% url 'register' %}">Зарегистрироваться</a>
</nav>
</main>
</body>
</html>
