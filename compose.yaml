# Full local stack: http://localhost:8000 is the Sipi interface.
name: backend
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: team_control_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d team_control_db"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment: &local-env
      DB_HOST: db
      DB_NAME: team_control_db
      DB_USER: postgres_user
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password}
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-sipi-docker-local-development-only}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      ASSISTANT_OLLAMA_URL: http://ollama:11434
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen3:4b}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-sipi@localhost}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  frontend:
    build: ./frontend
    environment:
      DJANGO_API_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "8000:3000"
    depends_on:
      backend:
        condition: service_healthy
  ollama:
    image: ollama/ollama:0.40.8
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 20
  model-init:
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [pull, "${ASSISTANT_MODEL:-qwen3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
  assistant-worker:
    build: ./backend
    restart: unless-stopped
    command: [python, manage.py, assistant_worker, --kind, chat]
    environment: *local-env
    depends_on:
      backend:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  ollama_models:
