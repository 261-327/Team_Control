# Optional: attach the team's EXISTING PostgreSQL volume to the server stack.
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set the existing DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set the existing DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set the existing DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:?Set the exact existing PostgreSQL volume name}
